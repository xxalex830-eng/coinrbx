<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Upgrader</title>
<style>
:root{color-scheme:dark;--bg:#0f1013;--panel:#15161a;--card:#1b1c21;--line:#26272e;--tx:#f2f2f4;--mut:#7d7f89;--y:#ffcc00;--y2:#ff9d00;--g:#35d06a;--r:#ff4d4d;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg);color:var(--tx);font-family:"Rubik","Segoe UI",system-ui,sans-serif}
body{min-height:100vh;display:grid;grid-template-columns:250px 1fr}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--y);outline-offset:2px}
.coin{display:inline-block;width:.8em;height:.8em;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe36b,#e0a000);vertical-align:-1px;margin-left:3px}
/* feed */
.feed{background:var(--panel);border-right:1px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:6px;height:100vh;overflow:hidden;position:sticky;top:0}
.drop{position:relative;background:var(--card);border-radius:8px;padding:10px 12px;display:grid;grid-template-columns:1fr 70px;align-items:center;font-size:11px;min-height:62px}
.drop b{display:block;font-size:13px}
.drop small{color:var(--mut);font-size:10px}
.drop .pct{font-size:10px;color:var(--mut);margin-bottom:3px}
.drop.hot{background:linear-gradient(120deg,#ffb300,#ff7a00);color:#2a1500;box-shadow:0 0 28px #ff9d0055}
.drop.hot small,.drop.hot .pct{color:#5b2f00}
.drop svg{width:70px;height:28px;justify-self:end}
.drop.new{animation:slide .5s ease}
@keyframes slide{from{transform:translateY(-30px);opacity:0}}
/* main */
main{padding:0 22px 40px;min-width:0}
header{display:flex;align-items:center;gap:22px;height:60px;border-bottom:1px solid var(--line);margin:0 -22px 22px;padding:0 22px}
.logo{font-weight:800;font-size:20px;display:flex;gap:8px;align-items:center}
.logo i{width:26px;height:26px;border-radius:7px;background:#fff;display:inline-block}
header .st{font-size:12px;color:var(--mut)}header .st b{display:block;color:var(--tx);font-size:14px}
.sp{flex:1}
.bal{display:flex;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden;font-weight:700}
.bal span{padding:0 16px}
.bal button{background:var(--y);color:#241a00;font-weight:700;font-size:12px;padding:12px 18px}
h1{text-align:center;font-size:22px;margin:4px 0 22px;display:flex;justify-content:center;align-items:center;gap:10px}
.chev{width:26px;height:26px}
.stage{display:grid;grid-template-columns:1fr 280px 1fr;gap:20px;max-width:1120px;margin:0 auto}
.box{background:radial-gradient(ellipse at 50% 60%,#1f1c10 0,var(--panel) 70%);border:1px solid var(--line);border-radius:14px;min-height:250px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:18px;gap:8px}
.box p{font-size:13px;font-weight:600}.box small{color:var(--mut);font-size:11px}
.box .big{width:110px;height:110px;opacity:.9}
.box .it{width:100%;display:flex;flex-direction:column;align-items:center;gap:6px}
.box .it svg{width:170px;height:70px;filter:drop-shadow(0 6px 14px #0008)}
.box .it b{font-size:15px}.box .it em{font-style:normal;color:var(--y);font-weight:700}
.box .it small{max-width:230px}
.box.win{box-shadow:0 0 0 2px var(--g),0 0 40px #35d06a55}
.box.lose{box-shadow:0 0 0 2px var(--r),0 0 40px #ff4d4d44}
/* wheel */
.wheel{position:relative;width:280px;height:280px;align-self:center}
.ring{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from var(--pointer-offset,180deg),var(--g) 0,#d8d82a calc(var(--p)*.5),var(--y2) var(--p),#2a2b32 var(--p));
-webkit-mask:radial-gradient(circle,transparent 98px,#000 99px,#000 124px,transparent 125px);mask:radial-gradient(circle,transparent 98px,#000 99px,#000 124px,transparent 125px);transition:--p .4s}
.tick{position:absolute;inset:6px;border-radius:50%;border:2px dashed #ffffff22}
.core{position:absolute;inset:36px;border-radius:50%;background:#101114;border:1px solid var(--line);display:grid;place-items:center;text-align:center}
.core .pc{font-size:34px;font-weight:800}.core small{display:block;color:var(--mut);font-size:11px}
.ptr{position:absolute;inset:0;transition:transform 4.2s cubic-bezier(.12,.7,.1,1)}
.ptr::before{content:"";position:absolute;left:50%;top:-4px;margin-left:-8px;border:8px solid transparent;border-top:0;border-bottom:16px solid var(--y);filter:drop-shadow(0 0 6px var(--y))}
.ptr::after{content:"";position:absolute;left:50%;top:12px;width:2px;height:20px;margin-left:-1px;background:var(--y)}
/* controls */
.ctl{display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:20px;max-width:1120px;margin:20px auto 0;align-items:center}
.amt{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:11px;color:var(--mut)}
.amt div{display:flex;justify-content:space-between;margin-bottom:8px}.amt b{color:var(--y)}
input[type=range]{width:100%;accent-color:var(--y)}
.go{background:linear-gradient(180deg,#ffd91a,#ffc400);color:#241a00;font-weight:800;font-size:14px;height:48px;border-radius:8px;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 4px 0 #b58a00,0 8px 24px #ffcc0033;transition:transform .1s,box-shadow .1s}
.go:active{transform:translateY(3px);box-shadow:0 1px 0 #b58a00}
.go:disabled{filter:grayscale(.8) brightness(.6);cursor:not-allowed}
.mult{display:flex;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;justify-content:center}
.mult button{background:var(--card);border:1px solid var(--line);border-radius:6px;font-size:11px;font-weight:700;padding:9px 12px;flex:1}
.mult button:hover{border-color:var(--y)}
.mult .p35{border-color:#ff4d4d99}.mult .p55{border-color:#ffb30099}.mult .p75{border-color:#35d06a99}
.tools{display:flex;gap:10px;max-width:1120px;margin:0 auto 10px}
.tools button{width:34px;height:34px;border-radius:8px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;color:var(--mut);transition:.15s}
.tools button.on{color:var(--y);border-color:var(--y);background:#2a2208}.pointer-setting{display:flex;align-items:center;gap:8px;margin-left:4px;color:var(--mut);font-size:11px}.pointer-setting select{background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:8px 10px;font:inherit}
.spinning .ring{animation:glow .6s ease-in-out infinite alternate}
@keyframes glow{to{filter:drop-shadow(0 0 14px #ffcc0088)}}
.spinning .core .pc{color:var(--y)}
.ring.wf{filter:drop-shadow(0 0 22px #35d06a)}.ring.lf{filter:drop-shadow(0 0 22px #ff4d4d)}
.sk img{width:86%;height:46px;object-fit:contain}.box .it img{width:180px;height:76px;object-fit:contain;filter:drop-shadow(0 6px 14px #0008)}.drop img{width:70px;height:28px;object-fit:contain;justify-self:end}
.hbtn,.pbtn,.sbtn{background:var(--card);border:1px solid var(--line);border-radius:8px;font-size:12px;font-weight:700;padding:10px 16px}
.hbtn:hover,.sbtn:hover{border-color:var(--y)}.pbtn{background:var(--y);border-color:var(--y);color:#241a00}.sbtn{padding:10px 12px}
.modal{position:fixed;inset:0;background:#000b;display:none;place-items:center;z-index:50}.modal.open{display:grid}
.mc{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;width:min(440px,92vw);display:flex;flex-direction:column;gap:12px;max-height:86vh;overflow:auto}
.mc h2{font-size:18px}.mc p,.mc small{color:var(--mut);font-size:12px}.mc h3{font-size:12px;color:var(--mut);margin-top:6px}
.mc input{background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:6px;padding:10px;font-size:13px;min-width:0;width:100%}
.row,.fr{display:flex;gap:8px;align-items:center}.fr{background:var(--card);border-radius:8px;padding:8px 10px}.fr span{flex:1;font-weight:600;font-size:13px}.fr .am{width:80px;padding:7px}
.err{color:var(--r)!important}
.bigcoin{width:150px;height:150px;border-radius:50%;margin:8px auto;font-size:32px;font-weight:800;color:#3a2a00;background:radial-gradient(circle at 35% 30%,#ffe36b,#e0a000);box-shadow:0 8px 0 #9a6c00,0 12px 30px #ffcc0044;transition:transform .05s}
.bigcoin:active{transform:translateY(6px);box-shadow:0 2px 0 #9a6c00}
.float{position:fixed;pointer-events:none;color:var(--y);font-weight:800;font-size:20px;animation:fl .8s ease-out forwards;z-index:60}@keyframes fl{to{transform:translateY(-70px);opacity:0}}
/* shop */
.tabs{display:flex;gap:6px}.tab{padding:10px 18px;border-radius:8px;font-weight:700;font-size:13px;color:var(--mut)}.tab.on{background:var(--card);color:var(--y);box-shadow:inset 0 -2px 0 var(--y)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:12px;font-weight:600;color:var(--mut)}.chip.on{color:#241a00;background:var(--y);border-color:var(--y)}
#shop{display:none;max-width:1120px;margin:0 auto}.onshop #shop{display:block}.onshop h1,.onshop .tools,.onshop .stage,.onshop .ctl,.onshop .lists{display:none}
.shopgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;min-height:420px;align-content:start}
.shopcard{background:var(--card);border:1px solid var(--line);border-top:3px solid #555;border-radius:10px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:10px;color:var(--mut);transition:transform .15s}
.shopcard:hover{transform:translateY(-3px)}.shopcard svg{width:84%;height:48px}.shopcard b{color:var(--tx);font-size:12px;min-height:30px;display:flex;align-items:center}
.shopcard.mid{border-top-color:#4b8bff}.shopcard.high{border-top-color:#a855f7}.shopcard.elite{border-top-color:#ff4d4d;background:linear-gradient(180deg,#2a1414,var(--card))}
.buy{background:var(--y);color:#241a00;font-weight:800;font-size:12px;border-radius:6px;padding:8px 10px;width:100%;margin-top:auto}.buy:disabled{background:#2a2b32;color:#6b6d77;cursor:not-allowed}
@media(max-width:1000px){.shopgrid{grid-template-columns:repeat(3,1fr)}}
/* lists */
.lists{display:grid;grid-template-columns:1fr 1fr;gap:20px;max-width:1120px;margin:20px auto 0}
.pn{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column}
.ph{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-weight:700;font-size:12px}
.ph input{background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:6px;padding:8px 10px;font-size:11px;width:100%;min-width:0}
.ph .f{display:flex;gap:6px;margin-left:auto;flex:1;max-width:260px}
.ph .sw{background:var(--card);border-radius:6px;padding:7px;line-height:0}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;min-height:372px;align-content:start}
.sk{background:var(--card);border:1px solid var(--line);border-radius:8px;height:116px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;font-size:10px;color:var(--mut);transition:border-color .15s,transform .15s}
.sk:hover{transform:translateY(-2px);border-color:#ffffff40}
.sk svg{width:80%;height:44px}.sk b{display:block;color:var(--tx);font-size:11px}
.sk i{font-style:normal;color:var(--y);font-weight:700;font-size:11px}
.sk.on{border-color:var(--y);background:linear-gradient(180deg,#2a2208,var(--card));box-shadow:inset 0 0 18px #ffcc0022}
.sk.empty{opacity:.35;pointer-events:none}
.sellbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;padding:10px;background:var(--card);border:1px solid var(--line);border-radius:8px;font-size:11px;color:var(--mut)}
.sellbar b{color:var(--y)}.sellbar button{background:var(--y);color:#241a00;border-radius:6px;padding:9px 12px;font-size:11px;font-weight:800;white-space:nowrap}.sellbar button:disabled{background:#34343a;color:#777;cursor:not-allowed}
.pg{display:flex;justify-content:center;align-items:center;gap:14px;margin-top:14px;font-size:12px;color:var(--mut)}
.pg button{background:var(--card);border-radius:5px;padding:6px 14px;color:var(--tx)}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,40px);opacity:0;background:var(--card);border:1px solid var(--line);padding:12px 20px;border-radius:10px;font-weight:600;font-size:13px;transition:.3s;pointer-events:none}
.toast.show{transform:translate(-50%,0);opacity:1}
@media(max-width:1000px){body{grid-template-columns:1fr}.feed{display:none}.stage,.ctl,.lists{grid-template-columns:1fr}.wheel{margin:auto}.grid{grid-template-columns:repeat(3,1fr)}header .st{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<aside class="feed" id="feed"></aside>
<main>
<header>
<nav class="tabs"><button class="tab on" data-t="up">Upgrader</button><button class="tab" data-t="shop">Shop</button></nav>
<div class="sp"></div>
<div class="bal"><span><span id="bal">0</span><i class="coin"></i></span><button id="topup">Top up</button></div>
</header>

<h1><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="#ffcc00" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l9-8 9 8M3 20l9-8 9 8"/></svg>Upgrader</h1>

<div class="tools"><button id="snd" class="on" title="Sound" aria-label="Sound"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 4V5L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4z"/></svg></button><button id="qk" title="Quick spin" aria-label="Quick spin"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M13 2L4 14h6l-1 8 9-12h-6z"/></svg></button><label class="pointer-setting" for="pointerPosition">Pointer position<select id="pointerPosition" aria-label="Pointer position"><option value="180" selected>Bottom</option><option value="0">Top</option><option value="90">Right</option><option value="270">Left</option></select></label></div>
<section class="stage">
<div class="box" id="from"></div>
<div class="wheel">
<div class="ring" id="ring" style="--p:180deg"></div><div class="tick"></div>
<div class="ptr" id="ptr"></div>
<div class="core"><div><div class="pc" id="pc">0%</div><small>chance</small></div></div>
</div>
<div class="box" id="to"></div>
</section>

<section class="ctl">
<div class="amt"><div>Balance amount: <b><span id="amtv">0.00</span><i class="coin"></i></b></div><input type="range" id="amt" min="0" max="100" step="0.01" value="0" aria-label="Balance amount"></div>
<button class="go" id="go" disabled><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#241a00" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l9-8 9 8M3 20l9-8 9 8"/></svg>Upgrade</button>
<div class="mult"><button data-m="2">x2</button><button data-m="4">x4</button><button data-m="8">x8</button><button class="p35" data-c="35">35%</button><button class="p55" data-c="55">55%</button><button class="p75" data-c="75">75%</button></div>
</section>

<section class="lists">
<div class="pn"><div class="ph"><span class="sw"><svg width="22" height="14" viewBox="0 0 22 14" fill="none" stroke="#ffcc00" stroke-width="3"><path d="M2 12C6 3 16 3 20 12"/></svg></span>MY SKINS</div><div class="grid" id="inv"></div><div class="sellbar"><span>Selected skin value: <b id="sellvalue">0.00</b><i class="coin"></i></span><button id="sellSelected" disabled>Sell selected</button></div><div class="pg"><button id="ip">&lsaquo;</button><span id="ipn">1 / 1</span><button id="in">&rsaquo;</button></div></div>
<div class="pn"><div class="ph">CHOOSE AN ITEM<div class="f"><input id="q" placeholder="Search"><input id="lo" placeholder="from" type="number" min="0"><input id="hi" placeholder="to" type="number" min="0"></div><button class="sw" id="sort" aria-label="Sort"><svg width="20" height="16" viewBox="0 0 24 20" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h17M16 2l4 4-4 4M21 14H4M8 10l-4 4 4 4"/></svg></button></div><div class="grid" id="cat"></div><div class="pg"><button id="cp">&lsaquo;</button><span id="cpn">1 / 1</span><button id="cn">&rsaquo;</button></div></div>
</section>
<section id="shop"><div class="pn"><div class="ph">SHOP <span id="scount" style="color:var(--mut);font-weight:500"></span><div class="f"><input id="sq" placeholder="Search"><button class="sw" id="ssort" aria-label="Sort"><svg width="20" height="16" viewBox="0 0 24 20" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h17M16 2l4 4-4 4M21 14H4M8 10l-4 4 4 4"/></svg></button></div></div><div id="stabs" class="chips"></div><div class="shopgrid" id="sgrid"></div><div class="pg"><button id="sp">&lsaquo;</button><span id="spn">1 / 1</span><button id="sn">&rsaquo;</button></div></div></section>
</main>
<div class="modal" id="clk"><div class="mc" style="text-align:center"><h2>Top up</h2><p>Tap the coin. Every tap adds 5 coins.</p><button class="bigcoin" id="coin" aria-label="Tap for 5 coins">+5</button><p><span id="cn2">0</span> taps this session</p><button class="sbtn x">Close</button></div></div>
<div class="toast" id="toast"></div>

S.rot=ang;p.style.transform=`rotate(${S.pointerOffset+ang}deg)`;an.cancel();

const to=$("to");ring.classList.add(win?"wf":"lf");jingle(win);
if(win){to.classList.add("win");S.inv.unshift({...target,u:++S.uid});toast(`Success! You won ${target.w} ${target.n}`)}
else{to.classList.add("lose");toast("Upgrade failed. Try a higher chance.")}
pushFeed({...target,pc:ch},win);
setTimeout(()=>{S.spin=false;$("pointerPosition").disabled=false;ring.classList.remove("wf","lf");render()},S.quick?500:1400);
};
};
/* x2/x4/x8 and % buttons: pick the target skin from the current stake */
document.querySelectorAll(".mult button").forEach(b=>b.onclick=()=>{
if(S.spin)return;
const sv=stake(),mult=b.dataset.m?+b.dataset.m:95/+b.dataset.c;
if(sv>0){
const want=sv*mult,best=ITEMS.reduce((a,i)=>Math.abs(i.p-want)<Math.abs(a.p-want)?i:a);
S.target=best;["q","lo","hi"].forEach(i=>$(i).value="");
S.cp=Math.floor([...ITEMS].sort((a,b)=>S.asc?a.p-b.p:b.p-a.p).indexOf(best)/PER);
render();toast(`${b.textContent}: ${best.w} ${best.n}`);return}
if(S.target){S.amt=Math.round(Math.min(S.target.p/mult,S.bal)*100)/100;render();return}
toast("Select skins or set a balance amount first");
});
/* load the skin catalog from skins.json (falls back to the built-in list if it can't be fetched) */
fetch("skins.json").then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{
ITEMS=(d.skins||d).map((s,i)=>({id:i,w:s.weapon,n:s.name,p:s.price,c:COL[i%COL.length]}));
if(!HAD)S.inv=[ITEMS[0],ITEMS[5],ITEMS[9]].filter(Boolean).map((it,k)=>({...it,u:k+1}));S.sel.clear();S.target=null;
$("feed").innerHTML="";[75,74.75,75,75,12.72,12.48,24.86,49.8,73.47,75].forEach((pc,i)=>$("feed").append(feedEl(ITEMS[(i*7+3)%ITEMS.length],pc,false)));$("feed").firstChild.classList.add("hot");
render()}).catch(()=>{});
/* modals + clicker */
document.querySelectorAll(".modal").forEach(m=>m.addEventListener("click",e=>{if(e.target===m||e.target.classList.contains("x"))m.classList.remove("open")}));
addEventListener("keydown",e=>{if(e.key==="Escape")document.querySelectorAll(".modal").forEach(m=>m.classList.remove("open"))});
let taps=0;
$("coin").onclick=e=>{S.bal=Math.round((S.bal+5)*100)/100;$("cn2").textContent=++taps;render();
const r=$("coin").getBoundingClientRect(),f=document.createElement("span");f.className="float";f.textContent="+5";
f.style.left=(e.clientX||r.left+r.width/2)-10+"px";f.style.top=(e.clientY||r.top)-20+"px";document.body.append(f);setTimeout(()=>f.remove(),800);tick(480+Math.random()*120,.05,.04)};
/* shop */
const _render=render;render=()=>{_render();if(document.body.classList.contains("onshop"))drawShop()};
const SH={t:"all",q:"",asc:true,pg:0},TIERS=[["all","All",0,1e12],["low","Budget",0,100],["mid","Mid roller",100,1500],["high","High roller",1500,10000],["elite","Elite",10000,1e12]];
const tierOf=p=>p>=10000?"elite":p>=1500?"high":p>=100?"mid":"low";
function drawShop(){
const T=TIERS.find(x=>x[0]===SH.t);
const list=ITEMS.filter(i=>i.p>=T[2]&&i.p<T[3]&&(i.w+" "+i.n).toLowerCase().includes(SH.q)).sort((a,b)=>SH.asc?a.p-b.p:b.p-a.p);
const PG=20,pc=Math.max(1,Math.ceil(list.length/PG));SH.pg=Math.min(SH.pg,pc-1);
$("stabs").innerHTML=TIERS.map(x=>`<button class='chip${x[0]===SH.t?" on":""}' data-t='${x[0]}'>${x[1]}</button>`).join("");
const g=$("sgrid");g.innerHTML="";
list.slice(SH.pg*PG,SH.pg*PG+PG).forEach(it=>{const d=document.createElement("div");d.className="shopcard "+tierOf(it.p);
d.innerHTML=`<small>${it.w}</small>${pic(it)}<b>${it.n}</b><button class='buy' ${S.bal>=it.p?"":"disabled"}>${fmt(it.p)}<i class='coin'></i></button>`;
d.querySelector(".buy").onclick=()=>buy(it);g.append(d)});
$("spn").textContent=`${SH.pg+1} / ${pc}`;$("scount").textContent=list.length+" skins";
}
function sellSelected(){if(S.spin)return;const sold=S.inv.filter(i=>S.sel.has(i.u));if(!sold.length){toast("Select skins to sell first");return}const value=sold.reduce((sum,i)=>sum+i.p,0);S.bal=Math.round((S.bal+value)*100)/100;const ids=new Set(sold.map(i=>i.u));S.inv=S.inv.filter(i=>!ids.has(i.u));S.sel.clear();render();toast(`Sold ${sold.length} skin${sold.length===1?"":"s"} for ${fmt(value)}`);tick(880,.12,.06,"triangle")}
$("sellSelected").onclick=sellSelected;
function buy(it){if(S.bal<it.p){toast("Not enough balance");return}S.bal=Math.round((S.bal-it.p)*100)/100;S.inv.unshift({...it,u:++S.uid});render();toast(`Bought ${it.w} ${it.n}`);tick(880,.12,.06,"triangle")}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x===b));document.body.classList.toggle("onshop",b.dataset.t==="shop");if(b.dataset.t==="shop")drawShop()});
$("stabs").onclick=e=>{const b=e.target.closest("button");if(b){SH.t=b.dataset.t;SH.pg=0;drawShop()}};
$("sq").oninput=e=>{SH.q=e.target.value.toLowerCase();SH.pg=0;drawShop()};
$("ssort").onclick=()=>{SH.asc=!SH.asc;drawShop()};
$("sp").onclick=()=>{SH.pg=Math.max(0,SH.pg-1);drawShop()};$("sn").onclick=()=>{SH.pg++;drawShop()};
render();
</script>
</body>
</html>
